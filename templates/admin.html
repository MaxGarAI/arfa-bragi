<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Промокоды — Арфа Браги</title><link rel="stylesheet" href="/static/game.css"></head><body><main><h1>Выданные промокоды</h1><p>Проверяйте код здесь и отмечайте его использованным при предъявлении в магазине.</p><form method="post"><input type="hidden" name="csrf" value="{{ csrf }}"><label>Код <input name="code" required></label> <button>Погасить код</button></form><div style="overflow:auto"><table><thead><tr><th>Код</th><th>Игрок</th><th>Выдан UTC</th><th>Статус</th></tr></thead><tbody>{% for p in promos %}<tr><td>{{ p.code }}</td><td>{{ p.name }}</td><td>{{ p.created }}</td><td>{{ 'Использован' if p.redeemed else 'Действует' }}</td></tr>{% endfor %}</tbody></table></div><p><a href="/game">← Игра</a></p></main></body></html>
